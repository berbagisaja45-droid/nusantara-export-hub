<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Admin Access · Nusantara Export Hub</title><link rel="stylesheet" href="styles.css?v=20261122-recovery2"></head><body>
<header><a class="brand" href="index.html">NUSANTARA <b>EXPORT HUB</b></a><nav><a href="admin.html">Admin sign in</a></nav></header>
<main style="max-width:540px;margin:50px auto;padding:20px"><h1 style="font:40px Georgia">Set a new password</h1><p>Open this page from the latest recovery email sent by Supabase. Do not reuse an old recovery link.</p><form id="f" style="display:grid;gap:14px;background:#f7f8f3;padding:24px;border-radius:8px"><label>New password<input name="p" type="password" minlength="8" required autocomplete="new-password" style="display:block;width:100%;padding:14px;margin-top:7px"></label><label>Confirm password<input name="c" type="password" minlength="8" required autocomplete="new-password" style="display:block;width:100%;padding:14px;margin-top:7px"></label><button class="button" type="submit">Update password</button></form><p id="s" role="status" aria-live="polite"></p></main>
<script>
const u="https://qbvbiaiwlgldxbnkpoyz.supabase.co",k="sb_publishable_73V0_NwW1j5pZTTdq15mwQ_irBusD0u";
const f=document.getElementById("f"),s=document.getElementById("s"),button=f.querySelector("button");
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
let accessToken=hash.get("access_token")||query.get("access_token"),tokenHash=hash.get("token_hash")||query.get("token_hash"),type=hash.get("type")||query.get("type"),authError=hash.get("error_description")||query.get("error_description");
let ready=false;
function validJwt(v){return typeof v==="string"&&v.split(".").length===3&&v.split(".").every(x=>x.length>0);}
async function prepareRecovery(){
 if(authError)throw new Error(authError);
 if(type!=="recovery")throw new Error("This is not a password-recovery link. Request a new recovery email.");
 if(validJwt(accessToken)){ready=true;return;}
 if(tokenHash){
  const response=await fetch(u+"/auth/v1/verify",{method:"POST",headers:{apikey:k,"Content-Type":"application/json"},body:JSON.stringify({token_hash:tokenHash,type:"recovery"})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.msg||data.message||"The recovery link is invalid or expired.");
  accessToken=data.access_token;
  if(!validJwt(accessToken))throw new Error("Supabase did not return a valid recovery session. Request a new email.");
  ready=true;return;
 }
 throw new Error("The recovery session in this link is incomplete or malformed. Request a fresh recovery email and open its newest link.");
}
prepareRecovery().then(()=>{s.textContent="Recovery link verified. Enter your new password below.";}).catch(error=>{f.hidden=true;s.textContent=error.message;});
f.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!ready){s.textContent="Recovery link is not verified. Request a new recovery email.";return;}
 const p=f.elements.p.value;
 if(p.length<8){s.textContent="Use at least 8 characters.";return;}
 if(p!==f.elements.c.value){s.textContent="Passwords do not match.";return;}
 button.disabled=true;s.textContent="Updating password…";
 try{
  const response=await fetch(u+"/auth/v1/user",{method:"PUT",headers:{apikey:k,Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},body:JSON.stringify({password:p})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.msg||data.message||data.error_description||"Password update failed");
  history.replaceState(null,"",location.pathname);f.reset();f.hidden=true;s.textContent="Password updated successfully. ";
  const a=document.createElement("a");a.href="admin.html";a.textContent="Return to Admin sign in";s.append(a);
 }catch(error){s.textContent="Could not update password: "+error.message+". Request a new recovery email if this link has expired.";}
 finally{button.disabled=false;}
});
</script></body></html>
