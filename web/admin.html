<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Nusantara Export Hub</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:55px auto;padding:0 22px}.admin-card{background:#f7f8f3;padding:26px;border-radius:8px;margin:20px 0}.admin-login{max-width:460px}.admin-form{display:grid;gap:12px}.admin-form input{padding:12px;border:1px solid #d8e0d5;border-radius:4px}.admin-table{width:100%;border-collapse:collapse;background:white}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #e3e8e0;text-align:left;font-size:13px;vertical-align:top}.admin-table th{background:#f0f4e9}.admin-actions{display:flex;gap:7px;flex-wrap:wrap}.admin-actions button{border:0;cursor:pointer}.secondary{background:#64756a}.danger{background:#8a3838}.status{font-weight:bold;text-transform:capitalize}.hidden{display:none!important}.admin-note{padding:12px;background:#eef5e9;margin:12px 0;font-size:13px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

<main class="admin-wrap"><small>CONTROL PANEL</small><h1 style="font:42px Georgia">Producer verification</h1><p>Review registrations before they appear in the public supplier directory.</p>
<section id="login-panel" class="admin-card admin-login"><h2>Admin sign in</h2><form id="login-form" class="admin-form"><label>Email<input name="email" type="email" required autocomplete="username" value="berbagisaja45@gmail.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in</button></form><p id="login-note" class="form-note" role="status"></p></section>
